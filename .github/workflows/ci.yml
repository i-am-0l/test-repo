name: CI Pipeline

on:
  push:
    branches: [main]          # runs on every push to main
  pull_request:
    branches: [main]          # runs on every PR targeting main

jobs:
  build-and-test:
    runs-on: ubuntu-latest    # GitHub provides this machine for free

    steps:
      - name: Checkout code
        uses: actions/checkout@v4          # pulls your repo onto the runner

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'       
       
      - name: Create output directory
        run: mkdir -p bin

      - name: Compile
        run: javac -d bin src/com/app/core/Box.java src/com/app/tester/TestFunctionality.java

      - name: Run
        run: java -cp bin com.app.tester.TestFunctionality